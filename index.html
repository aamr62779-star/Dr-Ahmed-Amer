<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>برنامج عيادة د. عامر - السجل الأساسي</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: Tahoma; background: #eef5f9; padding: 10px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button.add { background: #27ae60; color: white; padding: 12px; width: 100%; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #3498db; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center;">👥 سجل حضور المرضى</h2>
    
    <div class="section">
        <input type="text" id="pName" placeholder="اسم المريض">
        <input type="text" id="pPhone" placeholder="رقم الهاتف">
        <input type="date" id="pDate">
        <button class="add" onclick="savePatient()">حفظ في سجل العيادة</button>
        
        <table id="t-patients">
            <thead>
                <tr>
                    <th>اسم المريض</th>
                    <th>رقم الهاتف</th>
                    <th>تاريخ الحضور</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://clinic-app-data-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ضبط التاريخ الحالي تلقائياً
    document.getElementById('pDate').valueAsDate = new Date();

    function savePatient() {
        const name = document.getElementById('pName').value;
        const phone = document.getElementById('pPhone').value;
        const date = document.getElementById('pDate').value;

        if(name && phone && date) {
            db.ref('patients').push({name, phone, date});
            document.getElementById('pName').value = '';
            document.getElementById('pPhone').value = '';
        }
    }

    // عرض البيانات فورياً من السيرفر
    db.ref('patients').on('value', (snapshot) => {
        const tbody = document.querySelector('#t-patients tbody');
        tbody.innerHTML = '';
        snapshot.forEach((child) => {
            const data = child.val();
            tbody.innerHTML += `<tr>
                <td>${data.name}</td>
                <td>${data.phone}</td>
                <td>${data.date}</td>
            </tr>`;
        });
    });
</script>

</body>
</html>
