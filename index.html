<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة الأسنان التفاعلية - Amer Dent</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --selected-color: #e74c3c;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            padding: 20px;
        }

        .chart-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
        }

        .jaw {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .quadrant-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tooth {
            width: 45px;
            height: 65px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            cursor: pointer;
            background-color: #fff;
            transition: all 0.2s ease;
            user-select: none;
        }

        .tooth:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .tooth.selected {
            border-color: var(--selected-color);
            background-color: #fde8e7;
            box-shadow: 0 0 8px rgba(231, 76, 60, 0.4);
        }

        .tooth-number {
            font-weight: bold;
            font-size: 14px;
            color: var(--primary-color);
        }

        .tooth-icon {
            width: 20px;
            height: 25px;
            background: #e0e0e0;
            border-radius: 4px;
        }

        .tooth.selected .tooth-icon {
            background: var(--selected-color);
        }

        .control-panel {
            text-align: center;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        .selected-list {
            margin-bottom: 15px;
            font-size: 16px;
            color: #555;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-primary { background-color: var(--accent-color); color: white; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-danger { background-color: var(--selected-color); color: white; }
        .btn-danger:hover { background-color: #c0392b; }
    </style>
</head>
<body>

<div class="chart-container">
    <h2>خريطة الأسنان التفاعلية (تحديد متعدد للتركيبات)</h2>

    <div class="jaw">
        <div class="quadrant-row" id="upper-jaw"></div>
    </div>

    <hr style="border: 0; border-top: 2px dashed #ddd; margin: 20px 0;">

    <div class="jaw">
        <div class="quadrant-row" id="lower-jaw"></div>
    </div>

    <div class="control-panel">
        <div class="selected-list">
            <strong>الأسنان المحددة حالياً:</strong> <span id="selected-teeth-display">لا يوجد</span>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="applyTreatment('Bridge / تركيب ثابت متصل')">عمل تركيبة متصلة (Bridge)</button>
            <button class="btn btn-primary" onclick="applyTreatment('Single Crowns / طرابيش منفصلة')">عمل طرابيش (Crowns)</button>
            <button class="btn btn-danger" onclick="clearSelection()">إلغاء التحديد</button>
        </div>
    </div>
</div>

<script>
    let selectedTeeth = [];

    const upperTeethOrder = [18, 17, 16, 15, 14, 13, 12, 11, 21, 22, 23, 24, 25, 26, 27, 28];
    const lowerTeethOrder = [48, 47, 46, 45, 44, 43, 42, 41, 31, 32, 33, 34, 35, 36, 37, 38];

    function renderJaw(teethArray, containerId) {
        const container = document.getElementById(containerId);
        teethArray.forEach(num => {
            const toothDiv = document.createElement('div');
            toothDiv.className = 'tooth';
            toothDiv.dataset.id = num;
            toothDiv.innerHTML = `
                <span class="tooth-number">${num}</span>
                <div class="tooth-icon"></div>
            `;
            
            toothDiv.addEventListener('click', () => toggleToothSelection(num, toothDiv));
            container.appendChild(toothDiv);
        });
    }

    function toggleToothSelection(toothNum, element) {
        const index = selectedTeeth.indexOf(toothNum);
        
        if (index === -1) {
            selectedTeeth.push(toothNum);
            element.classList.add('selected');
        } else {
            selectedTeeth.splice(index, 1);
            element.classList.remove('selected');
        }
        
        selectedTeeth.sort((a, b) => a - b);
        updateDisplay();
    }

    function updateDisplay() {
        const display = document.getElementById('selected-teeth-display');
        if(selectedTeeth.length === 0) {
            display.innerText = "لا يوجد";
        } else {
            display.innerText = selectedTeeth.join(' ، ');
        }
    }

    function clearSelection() {
        selectedTeeth = [];
        document.querySelectorAll('.tooth').forEach(el => el.classList.remove('selected'));
        updateDisplay();
    }

    function applyTreatment(treatmentName) {
        if(selectedTeeth.length === 0) {
            alert('برجاء تحديد سنة أو ضرس واحد على الأقل أولاً!');
            return;
        }
        
        alert(`تم تطبيق إجراء (${treatmentName}) بنجاح على الأسنان: ${selectedTeeth.join(', ')}`);
        clearSelection();
    }

    renderJaw(upperTeethOrder, 'upper-jaw');
    renderJaw(lowerTeethOrder, 'lower-jaw');
</script>

</body>
</html>
